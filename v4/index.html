<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7efe3" />
  <title>A tiny invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="opening" id="opening">
      <div class="opening-card">
        <p class="tiny">A tiny invitation for you</p>
        <h1>Would you like to go on a date with me?</h1>
        <div class="choice-zone" id="choiceZone">
          <button class="button primary" id="yesBtn" type="button">Yes 😊</button>
          <button class="button secondary" id="noBtn" type="button">No</button>
        </div>
        <p class="micro" id="microcopy">The “No” button is only a little dramatic.</p>
      </div>
    </section>

    <section class="editor hidden" id="editor" aria-live="polite">
      <div class="invite-stage" id="inviteStage">
        <img class="invite-image" src="assets/invitation.png" alt="Illustrated first-date invitation" />

        <div class="live-field day-field">
          <span class="field-label">Day:</span>
          <select id="dayInput" aria-label="Choose a day">
            <option value="Tuesday" selected>Tuesday</option>
            <option value="Wednesday">Wednesday</option>
          </select>
        </div>

        <div class="live-field time-field">
          <span class="field-label">Time:</span>
          <input id="timeInput" type="time" aria-label="Choose a time" />
        </div>

        <div class="live-field place-field">
          <span class="field-label">Place:</span>
          <input id="placeInput" type="text" maxlength="34" placeholder="open" aria-label="Suggest a place" />
        </div>

        <div class="live-field plan-field">
          <span class="field-label">Plan:</span>
          <select id="drinkInput" aria-label="Choose a drink plan">
            <option value="Something to drink" selected>Something to drink</option>
            <option value="Coffee">Coffee</option>
            <option value="Tea or matcha">Tea or matcha</option>
            <option value="A drink">A drink</option>
            <option value="No preference">No preference</option>
          </select>
          <span class="plan-tail">and a little walk</span>
        </div>
      </div>

      <div class="compact-actions">
        <button class="button primary" id="saveBtn" type="button">Save card</button>
        <button class="text-button" id="backBtn" type="button">Back</button>
      </div>
      <p class="micro">Everything is optional except the day. The card updates as you choose.</p>
      <canvas id="canvas" width="1122" height="1402" hidden></canvas>
    </section>

    <section class="no-ending hidden" id="noEnding">
      <div class="opening-card">
        <p class="tiny">Fair enough</p>
        <h2>No pressure at all.</h2>
        <p>I still wanted to ask in a cute way :)</p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
